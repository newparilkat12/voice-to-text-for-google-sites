<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Widget</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f6f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #202124; font-size: 18px; }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 12px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 14px; resize: vertical; }
        .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 13px; }
        button.record { background: #34a853; }
        button.stop { background: #ea4335; }
        button:hover { opacity: 0.9; }
        #status { font-size: 12px; color: #5f6368; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h3>Voice Recorder & Speech Tool</h3>
    <textarea id="textBox" placeholder="Click 'Record Voice' and speak, or type here..."></textarea>
    <div class="buttons">
        <button class="record" onclick="startRecording()">🎤 Record Voice</button>
        <button onclick="speakText()">🔊 Read Aloud</button>
        <button class="stop" onclick="stopAll()">⏹ Stop</button>
    </div>
    <div id="status">Status: Ready</div>
</div>

<script>
    let recognition;
    function startRecording() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
            return;
        }
        
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        
        document.getElementById('status').innerText = "Status: Listening... Speak now.";
        
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            const textBox = document.getElementById('textBox');
            textBox.value += (textBox.value ? " " : "") + transcript;
            document.getElementById('status').innerText = "Status: Recording complete.";
        };
        
        recognition.onerror = function(event) {
            document.getElementById('status').innerText = "Error: " + event.error;
        };
        
        recognition.onend = function() {
            if(document.getElementById('status').innerText.includes("Listening")) {
                document.getElementById('status').innerText = "Status: Ready";
            }
        };
        
        recognition.start();
    }

    function speakText() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const text = document.getElementById('textBox').value;
            if (!text.trim()) return;
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
            document.getElementById('status').innerText = "Status: Reading aloud...";
            utterance.onend = () => { document.getElementById('status').innerText = "Status: Ready"; };
        } else {
            alert('Text-to-speech is not supported by your browser.');
        }
    }

    function stopAll() {
        if (recognition) {
            recognition.stop();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById('status').innerText = "Status: Stopped";
    }
</script>
</body>
</html>
